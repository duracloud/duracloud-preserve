name: Terraform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tf.yml"
      - "**.tf"
      - "**.tftest.hcl"
      - "terraform/modules/stack/assets/cloudfront/**"
      - "terraform/modules/stack/tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tf.yml"
      - "**.tf"
      - "**.tftest.hcl"
      - "terraform/modules/stack/assets/cloudfront/**"
      - "terraform/modules/stack/tests/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from .terraform-version
        id: tf-version
        run: echo "TF_VERSION=$(cat .terraform-version)" >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: node terraform/modules/stack/tests/public-file-response.test.js
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform -chdir=terraform/modules/users init -backend=false
      - run: terraform -chdir=terraform/modules/users validate
      - run: terraform -chdir=terraform/modules/users test
